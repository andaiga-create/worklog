<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>작업일지</title>
<style>
:root{--bg:#F2F2F7;--card:#fff;--fg:#1c1c1e;--sub:#6c6c70;--mut:#8e8e93;--line:rgba(60,60,67,.16);--blue:#007AFF;--selBg:rgba(0,122,255,.1);
  --glass:rgba(255,255,255,.78);--glassLn:rgba(255,255,255,.9);--danger:#FF3B30;--okBg:rgba(52,199,89,.16);--okFg:#1e8e3e;--recBg:rgba(0,122,255,.13);--recFg:#0062cc;--lock:#f7f7f9;--lockFg:#a1a1a6;--blob:.55}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--fg:#fff;--sub:#a1a1a6;--mut:#8e8e93;--line:rgba(84,84,88,.55);--blue:#0A84FF;--selBg:rgba(10,132,255,.2);
  --glass:rgba(44,44,46,.78);--glassLn:rgba(84,84,88,.6);--danger:#FF6B62;--okBg:rgba(48,209,88,.2);--okFg:#5fdc83;--recBg:rgba(10,132,255,.25);--recFg:#6cb4ff;--lock:#151517;--lockFg:#636366;--blob:.18}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font:18px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Malgun Gothic","Noto Sans KR",sans-serif;background:var(--bg);color:var(--fg)}
#app{position:relative;height:100vh;height:100dvh;max-width:560px;margin:0 auto;overflow:hidden}
.bl{position:absolute;border-radius:50%;opacity:var(--blob);pointer-events:none}
.b1{width:300px;height:300px;background:#BFD9FF;top:-90px;left:-90px}.b2{width:240px;height:240px;background:#FFD9B0;top:42%;right:-100px}.b3{width:220px;height:220px;background:#D8C8FF;bottom:-60px;left:-50px}
#banner{display:none;position:absolute;top:0;left:0;right:0;z-index:5;background:#FFD60A;color:#000;padding:calc(env(safe-area-inset-top) + 6px) 14px 6px;font-size:15px;text-align:center}
main{position:absolute;inset:0;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 12px) 18px 140px;-webkit-overflow-scrolling:touch;z-index:1}
#dock{position:absolute;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 14px);display:flex;gap:10px;z-index:4}
button{font:inherit;cursor:pointer;color:inherit}
.glass{background:var(--glass);border:1px solid var(--glassLn);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px)}
#dock button{height:62px;border-radius:31px;font-size:21px;font-weight:600;border:0}
#dock .pv{flex:1;color:var(--blue)}
#dock .nx{flex:2.2;background:var(--blue);color:#fff}
#dock button:disabled{opacity:.35}
.nav{display:flex;align-items:center;justify-content:space-between;height:40px;font-size:17px}
.nav .back{background:none;border:0;color:var(--blue);font-size:19px;padding:0;min-width:70px;text-align:left}
.nav span{color:var(--sub);font-size:15px}.nav .sp{min-width:70px}
.cap{display:flex;gap:5px;margin:2px 0 10px}.cap i{flex:1;height:5px;border-radius:3px;background:var(--line)}.cap i.on{background:var(--blue)}
h1{font-size:33px;font-weight:700;margin:4px 0 4px;line-height:1.18;letter-spacing:-.5px}
.sub{font-size:17px;color:var(--sub);margin:0 0 14px}
.grp{background:var(--card);border-radius:22px;overflow:hidden;margin-bottom:14px}
.it{display:flex;align-items:center;gap:14px;min-height:70px;padding:10px 16px;font-size:20px;border:0;border-bottom:0.5px solid var(--line);width:100%;background:none;text-align:left;border-radius:0}
.grp .it:last-child{border-bottom:0}
.it small{display:block;font-size:15px;color:var(--mut)}
.it .tx{flex:1;min-width:0;word-break:break-all}
.sq{flex:none;width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:25px}
.ck{margin-left:auto;flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);color:#fff;font-size:17px;display:flex;align-items:center;justify-content:center}
.it.sel{background:var(--selBg)}.it.sel .ck{background:var(--blue);border-color:var(--blue)}
.it.sel .ck::after{content:"✓"}
.it.lock{color:var(--lockFg);background:var(--lock);cursor:default}
.pill{margin-left:auto;flex:none;font-size:14px;padding:3px 10px;border-radius:12px;background:var(--okBg);color:var(--okFg)}
.pill.rc{background:var(--recBg);color:var(--recFg)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px;margin-bottom:10px}
.tl{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;font-size:17px;position:relative;padding:4px 0}
.tl .sq{width:70px;height:70px;border-radius:20px;font-size:34px;border:3px solid transparent}
.tl.sel .sq{border-color:var(--blue);box-shadow:0 0 0 3px var(--recBg)}
.tl.sel::after{content:"✓";position:absolute;top:0;right:10px;width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;border:2px solid var(--card)}
input[type=text],input[type=password],input[type=date],input[type=time],textarea{width:100%;min-height:58px;padding:10px 16px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-size:19px;margin-bottom:12px;-webkit-appearance:none}
select{width:100%;min-height:52px;padding:6px 8px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-size:16px;min-width:0}
textarea{min-height:150px;resize:vertical}
.frow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:12px}
.lnk{background:none;border:0;color:var(--blue);font-size:17px;text-decoration:underline;padding:6px 0;margin:2px 0 8px;display:inline-block}
.big{height:68px;border-radius:34px;font-size:22px;font-weight:600;width:100%;border:0;margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:10px}
.big.p{background:var(--blue);color:#fff}.big.g{color:var(--blue)}
.box{border-radius:22px;padding:14px 18px;margin-bottom:14px;font-size:19px}
.box.row{display:flex;justify-content:space-between;gap:10px}
.box .l{color:var(--sub)}
.warn{background:rgba(255,59,48,.12);color:var(--danger);border-radius:16px;padding:12px 14px;font-size:17px;margin:4px 0 12px}
.note{background:var(--card);border-radius:16px;padding:10px 14px;font-size:15px;color:var(--sub);margin:0 0 12px}
.err{color:var(--danger);font-weight:600;margin:0 0 12px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.pho{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--line)}
.pho img{width:100%;height:100%;object-fit:cover}
.pho button{position:absolute;top:4px;right:4px;width:36px;height:36px;border-radius:18px;border:0;background:#000b;color:#fff;font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{min-height:48px;padding:0 18px;border-radius:24px;border:1.5px solid var(--line);background:var(--card);font-size:17px}
.chip.sel{background:var(--blue);border-color:var(--blue);color:#fff}
.ib{flex:none;width:46px;height:46px;border-radius:14px;border:0;background:var(--selBg);font-size:21px}
.sum .it{min-height:56px;font-size:18px;align-items:flex-start;padding:12px 16px}
.sum .k{width:78px;flex:none;color:var(--sub);font-size:16px}
.sum .v{flex:1;word-break:break-all;white-space:pre-wrap;text-align:right}
.center{text-align:center}
@keyframes bb{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.6)}50%{opacity:1;transform:scale(1.1)}}
.bob{animation:bb 2.2s ease-in-out infinite}.st{transform-box:fill-box;transform-origin:center;animation:tw 1.6s ease-in-out infinite}
</style>
</head>
<body>
<div id="app">
  <div class="bl b1"></div><div class="bl b2"></div><div class="bl b3"></div>
  <div id="banner"></div>
  <main id="main"></main>
  <div id="dock"></div>
</div>

<script>
/* =====================================================================
   설정 (여기만 수정하면 작업구분/체크리스트 등을 바꿀 수 있음)
   ===================================================================== */
const CONFIG = {
  // Apps Script 웹앱 URL (…/exec). 비워두면 샘플 데이터로 동작하는 데모 모드
  API_URL: "https://script.google.com/macros/s/AKfycbxxsimDu3Thz44EDoW8Md_9NXsJTf27x8JHMYNPve0xHAXqjDTyK_1n41udrD1_HWvq/exec",

  WORK_TYPES: ["기계조립","윈치조립","대조립","설치","시운전","해체","포장","입고","이동","출고","기타"],
  TYPE_ICON: { "기계조립":["⚙️","#8E8E93"],"윈치조립":["⛓️","#5AC8FA"],"대조립":["🏗️","#FF9500"],"설치":["🔩","#34C759"],"시운전":["▶️","#007AFF"],
               "해체":["🔧","#FF3B30"],"포장":["📦","#AF52DE"],"입고":["📥","#30B0C7"],"이동":["🚚","#FFCC00"],"출고":["📤","#FF6482"],"기타":["📝","#8E8E93"] },

  // 마스터 '작업항목' 탭에 해당 작업구분 항목이 있으면 그쪽이 우선 사용됨
  CHECKLISTS: {
    "기계조립": ["베이스 프레임 정렬","붕/지브 결합","실린더 설치","핀·부싱 조립","배관 가조립","볼트 체결/토크","도장 보수"],
    "윈치조립": ["드럼 조립","감속기 설치","브레이크 조립","모터 장착","와이어 감기","커버 설치","그리스 주입"],
    "대조립": ["블록 위치 정렬","메인 구조 결합","용접 확인","수평 측정","배관 연결","케이블 트레이 설치","도장 보수"],
    "설치": ["위치 마킹","본체 탑재","앵커/볼트 체결","유압 배관 연결","전장 배선","접지 연결","수평 확인"],
    "시운전": ["유압유 주입","전장 연결","와이어 리깅","리미트 세팅","로드 테스트","유압유 드레인","누유 점검","작동 점검"],
    "해체": ["전원 차단","유압유 드레인","배관 분리","케이블 분리","와이어 철거","본체 분리","부품 분류/보관"],
    "포장": ["방청 처리","부품 포장","목박스 제작","고박 작업","라벨 부착","포장 사진 촬영"],
    "입고": ["입고 검수","수량 확인","파손 확인","적치","입고 서류 확인","라벨 부착"],
    "이동": ["지게차 이동","크레인 이동","트레일러 상차","경로 확인","적치 위치 정리"],
    "출고": ["출고 검수","상차","고박","출고 서류 작성","선적 사진 촬영","운송사 인계"],
    "기타": ["청소/정리","자재 정리","장비 점검","교육/회의","대기"]
  },

  STATUSES: ["완료","진행중","보류-부품대기","보류-선주확인"],

  // 시간대 버튼. 이어진(바로 옆) 버튼끼리만 함께 선택 가능, 총 작업시간은 선택한 시간대 합계(휴식 제외)
  TIME: { presets: [["08:30","10:00"],["10:10","12:00"],["13:00","15:00"],["15:10","17:30"],["18:00","20:00"]] },

  PHOTO: { max: 5, maxSize: 1280, quality: 0.7 },
  RECENT_MAX: 5
};

/* 데모 모드용 샘플 마스터 */
const DEMO_MASTER = {
  projects:[
    {yard:"HHI",yardName:"HHI",hull:"8123",owner:"",name:"크레인",code:"",serial:""},
    {yard:"HHI",yardName:"HHI",hull:"8123",owner:"",name:"윈치",code:"",serial:""},
    {yard:"HHI",yardName:"HHI",hull:"8124",owner:"",name:"크레인",code:"",serial:""},
    {yard:"SHI",yardName:"SHI",hull:"2201",owner:"",name:"크레인",code:"",serial:""}],
  workers:[{name:"김직영",affil:"직영",vendor:""},{name:"이직영",affil:"직영",vendor:""},
           {name:"박외주",affil:"외주",vendor:"대한용접"},{name:"정외주",affil:"외주",vendor:"성진기계"}],
  vendors:[{name:"대한용접"},{name:"성진기계"}],
  items:[]
};

/* =====================================================================
   저장소 / 상태
   ===================================================================== */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const uid = () => "c" + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const toMin = t => { const [h,m] = t.split(":").map(Number); return h*60 + m; };
const fmtMin = m => m ? `${Math.floor(m/60)}시간` + (m%60 ? ` ${m%60}분` : "") : "0시간";
const HHMM = /^\d\d:\d\d$/;

const STEPS = ["project","type","items","time","status","memo","confirm"];
const TITLES = { project:"프로젝트", type:"작업 구분", items:"작업 항목", time:"작업 시간", status:"진행 상태", memo:"사진·메모", confirm:"확인" };

function freshState(){
  const r = LS.get("wl_recent", [])[0];   // 방금 쓴 프로젝트를 미리 선택
  return { date: today(), yard: r ? r.yard : "", hull: r ? r.hull : "", equip: r ? r.equip : "",
           type:"", items:[], slots:[], direct:false, start:"", end:"", status:"", memo:"", photos:[], step:"project", clientId: uid() };
}
let who = LS.get("wl_who", null);            // { name, affil, vendor }
if(!who || !who.name) who = null;
let S = freshState();
let master = LS.get("wl_master", null);
if(master && !master.projects) master = null;
let view = "home";    // pin | setup | home | wizard | done | thanks | mylogs
let busy = false, msg = "", doneInfo = null, q = "", yf = "", hf = "", ef = "", showFilter = false, manage = false, editDate = false, sg = "";

function saveDraft(){ const d = Object.assign({}, S); delete d.photos; LS.set("wl_draft", d); }
const getPin = () => LS.get("wl_pin", "");
const getQueue = () => LS.get("wl_queue", []);
const getLogs = () => LS.get("wl_logs", []);

/* =====================================================================
   API
   ===================================================================== */
async function apiGet(params){
  const u = new URL(CONFIG.API_URL);
  Object.entries(params).forEach(([k,v]) => u.searchParams.set(k, v));
  const r = await fetch(u.toString());
  return r.json();
}
async function apiPost(payload){
  const r = await fetch(CONFIG.API_URL, { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(payload) });
  return r.json();
}
async function loadMaster(){
  if(!CONFIG.API_URL){ master = master || JSON.parse(JSON.stringify(DEMO_MASTER)); return true; }
  try{
    const res = await apiGet({ action:"master", pin:getPin() });
    if(res.error === "unauthorized"){ LS.set("wl_pin",""); view = "pin"; msg = "접근코드가 올바르지 않습니다."; return false; }
    if(res.error){ msg = res.error; }
    else { master = res; getOps().forEach(o => applyOp(master, o)); saveMaster(); return true; }
  }catch(e){ /* 오프라인: 캐시 사용 */ }
  return !!master;
}
async function loadMyLogs(){
  if(!CONFIG.API_URL || !navigator.onLine || !who) return;
  try{
    const r = await apiGet({ action:"mylogs", pin:getPin(), writer:who.name });
    if(r.logs){
      const queued = getLogs().filter(l => l.writer === who.name && String(l.id).startsWith("대기-"));
      const other = getLogs().filter(l => l.writer !== who.name);
      LS.set("wl_logs", other.concat(r.logs, queued));
      if(view === "home" || view === "mylogs" || (view === "wizard" && S.step === "time")) render();
    }
  }catch(e){}
}

/* =====================================================================
   작업항목 추가/수정/삭제 (시트 '작업항목' 탭에 자동 반영)
   ===================================================================== */
let opsFlushing = false;
const getOps = () => LS.get("wl_ops", []);
const saveMaster = () => LS.set("wl_master", master);
function applyOp(m, o){
  m.items = m.items || [];
  const i = m.items.findIndex(x => x.type === o.type && x.name === o.name);
  if(o.op === "add"){ if(i < 0) m.items.push({ type:o.type, name:o.name }); }
  else if(o.op === "del"){ if(i >= 0) m.items.splice(i,1); }
  else if(o.op === "rename" && i >= 0){
    if(m.items.some(x => x.type === o.type && x.name === o.newName)) m.items.splice(i,1); else m.items[i].name = o.newName;
  }
}
function itemOp(o){ applyOp(master, o); saveMaster(); const ops = getOps(); ops.push(o); LS.set("wl_ops", ops); flushOps(); }
function ensureSeeded(type){   // 시트에 항목이 없던 작업구분은 기본 항목을 시트로 옮겨 수정/삭제 가능하게 함
  if(!master.items.some(i => i.type === type)) (CONFIG.CHECKLISTS[type] || []).forEach(n => itemOp({ op:"add", type, name:n }));
}
function addMasterItem(name){
  name = (name || "").trim(); if(!name) return;
  ensureSeeded(S.type); itemOp({ op:"add", type:S.type, name });
  if(!S.items.includes(name)) S.items.push(name);
  saveDraft(); render();
}
async function flushOps(){
  if(opsFlushing || !CONFIG.API_URL || !navigator.onLine) return;
  const ops = getOps(); if(!ops.length) return;
  opsFlushing = true;
  try{
    const r = await apiPost({ pin:getPin(), action:"itemops", ops });
    if(r && r.ok) LS.set("wl_ops", getOps().slice(ops.length));
  }catch(e){} finally { opsFlushing = false; }
  if(getOps().length && navigator.onLine) setTimeout(flushOps, 2000);
}

/* =====================================================================
   시간 계산 / 겹침 검사 (같은 작성자, 같은 날짜)
   ===================================================================== */
const P = () => CONFIG.TIME.presets;
function range(){
  if(S.direct) return (S.start && S.end) ? [S.start, S.end] : null;
  if(!S.slots.length) return null;
  return [P()[S.slots[0]][0], P()[S.slots[S.slots.length-1]][1]];
}
function totalMin(){
  if(S.direct) return (S.start && S.end) ? Math.max(0, toMin(S.end) - toMin(S.start)) : 0;
  return S.slots.reduce((t,i) => t + toMin(P()[i][1]) - toMin(P()[i][0]), 0);
}
const hoursNum = () => Math.round(totalMin()/60*100)/100;
const timeTxt = () => S.direct ? `${S.start} ~ ${S.end}` : S.slots.map(i => P()[i].join("~")).join(", ");
function myDayLogs(){
  return getLogs().filter(l => who && l.writer === who.name && l.date === S.date && HHMM.test(l.start || "") && HHMM.test(l.end || ""));
}
const overlaps = (a0, a1, b0, b1) => toMin(a0) < toMin(b1) && toMin(b0) < toMin(a1);
const conflictWith = r => r ? (myDayLogs().find(l => overlaps(r[0], r[1], l.start, l.end)) || null) : null;
function dayStats(date){
  const ls = getLogs().filter(l => who && l.writer === who.name && l.date === date);
  return { n: ls.length, m: ls.reduce((t,l) => t + Math.round((parseFloat(l.hours) || 0) * 60), 0) };
}
function toggleSlot(i){
  const p = P()[i];
  if(conflictWith([p[0], p[1]])) return;
  const s = S.slots;
  if(s.includes(i)) S.slots = (i === Math.min(...s) || i === Math.max(...s)) ? s.filter(x => x !== i) : [i];
  else if(s.length && (i === Math.min(...s) - 1 || i === Math.max(...s) + 1)) S.slots = s.concat(i);
  else S.slots = [i];
  S.slots.sort((a,b) => a-b);
}

function valid(id){
  switch(id){
    case "project": return !!(S.yard && S.hull && S.equip);
    case "type": return !!S.type;
    case "items": return S.items.length > 0;
    case "time": { const r = range(); return !!(r && totalMin() > 0 && !conflictWith(r)); }
    case "status": return !!S.status;
    default: return true;
  }
}
const projLabel = () => `${S.yard}-${S.hull}-${S.equip}`;

/* =====================================================================
   이동
   ===================================================================== */
let lastKey = "", lastAt = 0, navAt = 0;
function go(id){ navAt = Date.now(); S.step = id; editDate = false; saveDraft(); render(); $("#main").scrollTop = 0; }
function advance(){ const i = STEPS.indexOf(S.step); if(valid(S.step)) go(STEPS[Math.min(i+1, STEPS.length-1)]); }
function back(){
  const i = STEPS.indexOf(S.step);
  if(i <= 0){ view = "home"; navAt = Date.now(); render(); $("#main").scrollTop = 0; } else go(STEPS[i-1]);
}
function startNew(){
  const d = LS.get("wl_draft", null);
  S = (d && d.clientId && d.date === today() && (d.type || (d.items||[]).length)) ? Object.assign(freshState(), d, { photos: [] }) : freshState();
  if(!STEPS.includes(S.step)) S.step = "project";
  msg = ""; manage = false; view = "wizard"; navAt = Date.now(); render(); $("#main").scrollTop = 0;
}
function nextJob(){ LS.set("wl_draft", {}); S = freshState(); msg = ""; manage = false; view = "wizard"; navAt = Date.now(); render(); $("#main").scrollTop = 0; }

/* =====================================================================
   화면
   ===================================================================== */
function show(html, dock){
  $("#main").innerHTML = html;
  const d = $("#dock"); d.innerHTML = dock || ""; d.style.display = dock ? "flex" : "none";
}
function render(){
  const qn = getQueue().length, b = $("#banner");
  b.style.display = qn ? "block" : "none";
  b.textContent = qn ? `전송 대기 ${qn}건 (연결되면 자동 전송)` : "";
  if(view === "pin") return renderPin();
  if(view === "home") return renderHome();
  if(view === "thanks") return renderThanks();
  if(view === "done") return renderDone();
  if(!master){
    show(`<h1>불러오는 중…</h1><p class="sub">${esc(msg) || "마스터 데이터를 가져오고 있어요."}</p>`, `<button class="nx" data-a="retry">다시 시도</button>`);
    return;
  }
  if(view === "setup") return renderSetup();
  if(view === "mylogs") return renderLogs();
  renderStep();
}

function dateLabel(){
  const d = new Date(); return `${d.getMonth()+1}월 ${d.getDate()}일 ${"일월화수목금토"[d.getDay()]}요일`;
}

function nav(i){
  const n = Math.min(i + 1, 6);
  return `<div class="nav"><button class="back" data-a="back">‹ 이전</button><span>${i < 6 ? `${n} / 6 · ` : ""}${TITLES[STEPS[i]]}</span><span class="sp"></span></div>
    <div class="cap">${[1,2,3,4,5,6].map(k => `<i class="${k <= n ? "on" : ""}"></i>`).join("")}</div>`;
}
function dockFor(i){
  const last = STEPS[i] === "confirm";
  return `<button class="pv glass" data-a="back">이전</button>` +
    (last ? `<button class="nx" data-a="submit" ${busy?"disabled":""}>${busy?"전송 중…":"제출"}</button>`
          : `<button class="nx" data-a="next" ${valid(STEPS[i])?"":"disabled"}>다음</button>`);
}
function renderStep(){
  if(!STEPS.includes(S.step)) S.step = "project";
  const i = STEPS.indexOf(S.step);
  show(nav(i) + STEP[S.step](), dockFor(i));
  if(S.step === "project") renderProjectLists();
}

    return `<h1>몇 시에 작업했나요?</h1><p class="sub">이어진 시간대는 함께 고를 수 있어요.</p>
      <div class="note">오늘(${esc(S.date)}) 이미 쓴 시간은 겹치게 쓸 수 없어요.</div>
      ${S.direct ? "" : `<div class="grp">${slots}</div>`}${direct}${err}

    return `<h1>작업이 끝났나요?</h1><p class="sub">하나만 고르세요.</p><div class="grp">${CONFIG.STATUSES.map(v =>

  },
  memo(){
    return `<h1>사진과 메모</h1><p class="sub">없으면 그냥 다음으로 넘어가세요.</p>
      <div class="photos">${S.photos.map((p,i) => `<div class="pho"><img src="${p}" alt=""><button data-a="delphoto" data-v="${i}" aria-label="삭제">×</button></div>`).join("")}</div>

      <p class="note">앱을 닫으면 첨부한 사진은 임시저장되지 않아요.</p>`;
  },
  confirm(){
    const row = (k, label, v, extra) => `<button class="it" data-a="goto" data-v="${k}"><span class="k">${label}</span><span class="v">${esc(v) || "-"}</span></button>`;
    return `<h1>이대로 제출할까요?</h1><p class="sub">고칠 곳을 누르면 돌아가요.</p>

        ${row("time","작업 시간",S.slots.length||S.direct ? `${timeTxt()} (${fmtMin(totalMin())})` : "")}${row("status","진행 상태",S.status)}
        ${row("memo","메모",S.memo.trim())}${row("memo","사진",S.photos.length ? S.photos.length+"장" : "")}</div>
      ${msg ? `<div class="err">${esc(msg)}</div>` : ""}`;
  }

/* ---------- 프로젝트 검색 ---------- */
function projMatches(p, term){
  if(!term) return true;
  return [p.yard, p.yardName, p.hull, p.name, p.code, p.owner, p.serial].join(" ").toLowerCase().includes(term.toLowerCase());
}
function renderProjectLists(){
  const el = $("#plist"); if(!el) return;
  const all = master.projects, key = p => p.yard + "|" + p.hull + "|" + p.name;
  const yards = [...new Set(all.map(p => p.yard))];
  if(yf && !yards.includes(yf)) yf = "";
  const byY = all.filter(p => !yf || p.yard === yf);
  const hulls = [...new Set(byY.map(p => p.yard + "|" + p.hull))];
  if(hf && !hulls.includes(hf)) hf = "";
  const byH = byY.filter(p => !hf || p.yard + "|" + p.hull === hf);
  if(ef && !byH.some(p => key(p) === ef)) ef = "";
  const opt = (v, label, cur) => `<option value="${esc(v)}" ${v===cur?"selected":""}>${esc(label)}</option>`;
  const filters = showFilter ? `<div class="frow">
      <select id="yfsel">${opt("", "조선소", yf)}${yards.map(y => opt(y, y, yf)).join("")}</select>
      <select id="hfsel">${opt("", "호선", hf)}${hulls.map(h => opt(h, h.split("|")[1], hf)).join("")}</select>
      <select id="efsel">${opt("", "장비", ef)}${byH.map(p => opt(key(p), p.name, ef)).join("")}</select></div>` : "";
  const searching = q.trim() || (showFilter && (yf || hf || ef));
  let body = "";
  if(searching){
    const list = byH.filter(p => (!ef || key(p) === ef) && projMatches(p, q.trim())).slice(0, 30);
    body = list.length ? `<div class="grp">${list.map(p => sel(p.yard===S.yard&&p.hull===S.hull&&p.name===S.equip,
        `data-a="pickproj" data-y="${esc(p.yard)}" data-h="${esc(p.hull)}" data-e="${esc(p.name)}"`,
        `<span class="sq" style="background:var(--selBg)">🚢</span><span class="tx">${esc(p.yard)}-${esc(p.hull)}-${esc(p.name)}</span>`)).join("")}</div>`
      : `<p class="sub">해당하는 프로젝트가 없어요.</p>`;
  } else if(!all.length) body = `<p class="sub">등록된 프로젝트가 없어요. 시트의 '프로젝트' 탭을 확인하세요.</p>`;
  else body = `<p class="sub">검색어를 입력하면 프로젝트가 표시돼요.</p>`;
  el.innerHTML = filters + body;
}

  const mine = getLogs().filter(l => who && l.writer === who.name).sort((a,b) => (b.date + (b.start||"")).localeCompare(a.date + (a.start||"")));
  let lastDate = "";
  const html = mine.slice(0,50).map(l => {
    const head = l.date !== lastDate ? `<p class="sub" style="margin:14px 4px 6px;font-weight:600">${esc(l.date)}</p>` : ""; lastDate = l.date;
    return head + `<div class="grp" style="margin-bottom:8px"><div class="it" style="display:block"><div style="font-weight:600">${esc(l.yard)}-${esc(l.hull)}-${esc(l.equip)}</div>
      <small>${esc(l.type)} · ${esc(l.start)}~${esc(l.end)} · ${esc(l.status)}${String(l.id).startsWith("대기-") ? " · 전송 대기" : ""}</small>
      <div style="font-size:16px;color:var(--sub)">${esc((l.items||[]).join(", "))}</div></div></div>`;
  }).join("");
  show(`<div class="nav"><button class="back" data-a="home">‹ 홈</button><span></span><span class="sp"></span></div>
    <h1>내가 쓴 일지</h1>${html || `<p class="sub">작성한 일지가 없어요.</p>`}`, "");
}

function art(){

}

  const st = dayStats(today());

/* =====================================================================
   제출 / 대기열
   ===================================================================== */
function buildPayload(){
  const r = range();
  return { pin:getPin(), clientId:S.clientId, date:S.date, writer:who.name, affil:who.affil, vendor:who.affil==="외주" ? (who.vendor||"") : "",
    yard:S.yard, hull:S.hull, equip:S.equip, type:S.type, items:S.items, start:r[0], end:r[1],
    hours:hoursNum(), status:S.status, detail:S.memo.trim(), notes:"", photos:S.photos };
}
function toLog(p, id){
  return { id, date:p.date, writer:p.writer, affil:p.affil, vendor:p.vendor, yard:p.yard, hull:p.hull, equip:p.equip,
    type:p.type, items:p.items, start:p.start, end:p.end, hours:p.hours, status:p.status, detail:p.detail, notes:p.notes };
}
function rememberRecent(){
  const r = LS.get("wl_recent", []).filter(x => !(x.yard===S.yard && x.hull===S.hull && x.equip===S.equip));
  r.unshift({ yard:S.yard, hull:S.hull, equip:S.equip });
  LS.set("wl_recent", r.slice(0, CONFIG.RECENT_MAX));
}
function finish(info, p){
  rememberRecent();
  const logs = getLogs(); logs.push(toLog(p, info.id || ("대기-" + p.clientId))); LS.set("wl_logs", logs.slice(-300));
  LS.set("wl_draft", {});
  doneInfo = info; view = "done"; busy = false; render(); $("#main").scrollTop = 0;
}
async function submit(){
  if(busy) return;
  const bad = STEPS.slice(0, -1).find(x => !valid(x));
  if(bad){ msg = bad === "time" ? "작업 시간을 확인하세요. 이미 쓴 시간과 겹치면 안 돼요." : `"${TITLES[bad]}" 항목을 확인하세요.`; return go(bad); }
  busy = true; msg = ""; render();
  const p = buildPayload();
  if(!CONFIG.API_URL){ return finish({ id:`${p.yard}-${p.hull}-${p.equip}-${p.date.replace(/-/g,"")}-${p.writer}-01 (데모)` }, p); }
  let res;
  try{ res = await apiPost(p); }
  catch(e){
    const qd = getQueue(); qd.push(p);
    if(!LS.set("wl_queue", qd)){ busy = false; msg = "저장 공간이 부족합니다. 사진 수를 줄여 다시 시도하세요."; return render(); }
    return finish({ queued:true }, p);
  }
  if(res && res.ok) return finish({ id:res.id }, p);
  busy = false;
  if(res && res.error === "unauthorized"){ view = "pin"; msg = "접근코드를 다시 입력하세요."; return render(); }
  if(res && res.error === "overlap"){ msg = "같은 시간에 이미 쓴 일지가 있어요. 시간을 바꿔 주세요."; loadMyLogs(); return go("time"); }
  msg = "제출 실패: " + ((res && res.error) || "알 수 없는 오류"); render();
}
let flushing = false;
async function flushQueue(){
  if(flushing || !CONFIG.API_URL || !navigator.onLine) return;
  flushing = true;
  try{
    let qd = getQueue();
    while(qd.length){
      const p = Object.assign({}, qd[0], { pin:getPin() });
      let res; try{ res = await apiPost(p); }catch(e){ break; }
      if(res && res.ok){
        qd = getQueue().slice(1); LS.set("wl_queue", qd);
        const logs = getLogs().map(l => l.id === "대기-" + p.clientId ? Object.assign(l, { id:res.id }) : l); LS.set("wl_logs", logs);
      } else if(res && res.error === "overlap"){   // 겹치는 대기 건은 버려서 대기열이 막히지 않게 함
        qd = getQueue().slice(1); LS.set("wl_queue", qd);
        LS.set("wl_logs", getLogs().filter(l => l.id !== "대기-" + p.clientId));
      } else { if(res && res.error === "unauthorized"){ view = "pin"; msg = "접근코드를 다시 입력하세요."; } break; }
    }
  } finally { flushing = false; render(); }
}

/* ---------- 사진 리사이즈 ---------- */
function resizeImage(file){
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const m = CONFIG.PHOTO.maxSize, k = Math.min(1, m / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); resolve(c.toDataURL("image/jpeg", CONFIG.PHOTO.quality));
    };
    img.onerror = reject; img.src = url;
  });
}

/* =====================================================================
   이벤트
   ===================================================================== */
function setWho(name, g){
  const w = master.workers.find(x => x.name === name && (g === "직영" ? w0(x) : (x.affil === "외주" && x.vendor === g)));
  who = { name, affil: g === "직영" ? "직영" : "외주", vendor: g === "직영" ? "" : g };
  LS.set("wl_who", who); sg = ""; view = "home"; render(); loadMyLogs();
}
const w0 = x => x.affil !== "외주";
const NAV_LOCK = ["pick","pickproj","toggle","preset","goto","new","nextjob","setwho"];
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-a]"); if(!t) return;
  const a = t.dataset.a, v = t.dataset.v, f = t.dataset.f;
  // 중복 터치 방지: 같은 버튼 연타, 화면 전환 직후 겹친 터치는 무시
  const now = Date.now(), key = [a, f, v, t.dataset.y, t.dataset.h, t.dataset.e].join("|");
  if(key === lastKey && now - lastAt < 400) return;
  if(NAV_LOCK.includes(a) && now - navAt < 400) return;
  lastKey = key; lastAt = now;
  switch(a){
    case "new": startNew(); break;
    case "nextjob": nextJob(); break;
    case "endday": view = "thanks"; render(); $("#main").scrollTop = 0; break;
    case "home": view = "home"; navAt = Date.now(); render(); $("#main").scrollTop = 0; break;
    case "logs": view = "mylogs"; navAt = Date.now(); render(); $("#main").scrollTop = 0; loadMyLogs(); break;
    case "who": sg = ""; view = "setup"; navAt = Date.now(); render(); $("#main").scrollTop = 0; break;
    case "sgroup": sg = v; render(); break;
    case "setwho": setWho(v, t.dataset.g); break;
    case "pick":
      if(f === "type" && S.type !== v) S.items = [];
      S[f] = v; saveDraft(); render(); break;
    case "pickproj": S.yard = t.dataset.y; S.hull = t.dataset.h; S.equip = t.dataset.e; saveDraft(); render(); break;
    case "toggle": { const i = S.items.indexOf(v); i < 0 ? S.items.push(v) : S.items.splice(i,1); saveDraft(); render(); break; }
    case "preset": toggleSlot(Number(v)); saveDraft(); render(); break;
    case "direct": S.direct = !S.direct; S.slots = []; S.start = ""; S.end = ""; saveDraft(); render(); break;
    case "filter": showFilter = !showFilter; if(!showFilter){ yf = hf = ef = ""; } render(); break;
    case "manage": manage = !manage; render(); break;
    case "additembtn": addMasterItem($("#additem").value); break;
    case "itemedit": {
      const nn = (prompt("항목 이름 수정", v) || "").trim(); if(!nn || nn === v) break;
      ensureSeeded(S.type); itemOp({ op:"rename", type:S.type, name:v, newName:nn });
      S.items = S.items.map(x => x === v ? nn : x).filter((x,i,arr) => arr.indexOf(x) === i); saveDraft(); render(); break; }
    case "itemdel":
      if(!confirm(`"${v}" 항목을 삭제할까요?\n(모든 작업자의 목록에서 사라집니다)`)) break;
      ensureSeeded(S.type); itemOp({ op:"del", type:S.type, name:v }); S.items = S.items.filter(x => x !== v); saveDraft(); render(); break;
    case "delphoto": S.photos.splice(v,1); render(); break;
    case "editdate": editDate = !editDate; render(); break;
    case "next": advance(); break;
    case "back": back(); break;
    case "goto": go(v); break;
    case "submit": submit(); break;
    case "retry": await loadMaster(); render(); break;
    case "pinok": {
      const val = ($("#pin").value || "").trim(); if(!val) break;
      LS.set("wl_pin", val); msg = ""; view = "home"; show(`<h1>확인 중…</h1>`, "");
      await loadMaster(); if(view !== "pin") view = who ? "home" : "setup"; render(); loadMyLogs(); break; }
  }
});

document.addEventListener("input", e => {
  if(e.target.id === "memo"){ S.memo = e.target.value; saveDraft(); }
  if(e.target.id === "q"){ q = e.target.value; renderProjectLists(); }
});
document.addEventListener("change", async e => {
  const id = e.target.id;
  if(id === "datepick" && e.target.value){ S.date = e.target.value; editDate = false; saveDraft(); render(); loadMyLogs(); }
  if(id === "tstart"){ S.start = e.target.value; saveDraft(); render(); }
  if(id === "tend"){ S.end = e.target.value; saveDraft(); render(); }
  if(id === "yfsel"){ yf = e.target.value; hf = ""; ef = ""; renderProjectLists(); }
  if(id === "hfsel"){ hf = e.target.value; ef = ""; if(hf) yf = hf.split("|")[0]; renderProjectLists(); }
  if(id === "efsel"){ ef = e.target.value; if(ef){ const [y,h] = ef.split("|"); yf = y; hf = y + "|" + h; } renderProjectLists(); }
  if(id === "photoin"){
    for(const file of [...e.target.files]){
      if(S.photos.length >= CONFIG.PHOTO.max) break;
      try{ S.photos.push(await resizeImage(file)); }catch(err){}
    }
    render();
  }
});
document.addEventListener("keydown", e => {
  if(e.key !== "Enter") return;
  const id = e.target.id, val = (e.target.value || "").trim();
  if(id === "pin"){ const b = document.querySelector("[data-a=pinok]"); if(b) b.click(); return; }
  if(!val) return;
  if(id === "addwho"){
    const g = sg || (who && who.affil === "외주" ? who.vendor : "직영");
    if(!master.workers.some(w => w.name === val && (g === "직영" ? w0(w) : w.vendor === g)))
      master.workers.push({ name:val, affil:g === "직영" ? "직영" : "외주", vendor:g === "직영" ? "" : g });
    setWho(val, g);
  }
  else if(id === "additem"){ addMasterItem(val); }
});
window.addEventListener("online", () => { flushOps(); flushQueue(); });

/* =====================================================================
   시작
   ===================================================================== */
(async function init(){
  if(CONFIG.API_URL && !getPin()){ view = "pin"; render(); return; }
  render();
  await loadMaster();
  if(view !== "pin") view = who ? "home" : "setup";
  render();
  flushOps();
  flushQueue();
  loadMyLogs();
})();
</script>
