<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>작업일지</title>
<style>
:root{--bg:#F2F2F7;--card:#fff;--fg:#1c1c1e;--sub:#6c6c70;--mut:#8e8e93;--line:rgba(60,60,67,.16);--blue:#007AFF;--selBg:rgba(0,122,255,.1);
  --glass:rgba(255,255,255,.78);--glassLn:rgba(255,255,255,.9);--danger:#FF3B30;--okBg:rgba(52,199,89,.16);--okFg:#1e8e3e;--recBg:rgba(0,122,255,.13);--recFg:#0062cc;--lock:#f7f7f9;--lockFg:#a1a1a6;--blob:.55}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--fg:#fff;--sub:#a1a1a6;--mut:#8e8e93;--line:rgba(84,84,88,.55);--blue:#0A84FF;--selBg:rgba(10,132,255,.2);
  --glass:rgba(44,44,46,.78);--glassLn:rgba(84,84,88,.6);--danger:#FF6B62;--okBg:rgba(48,209,88,.2);--okFg:#5fdc83;--recBg:rgba(10,132,255,.25);--recFg:#6cb4ff;--lock:#151517;--lockFg:#636366;--blob:.18}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font:18px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Malgun Gothic","Noto Sans KR",sans-serif;background:var(--bg);color:var(--fg)}
#app{position:relative;height:100vh;height:100dvh;max-width:560px;margin:0 auto;overflow:hidden}
.bl{position:absolute;border-radius:50%;opacity:var(--blob);pointer-events:none}
.b1{width:300px;height:300px;background:#BFD9FF;top:-90px;left:-90px}.b2{width:240px;height:240px;background:#FFD9B0;top:42%;right:-100px}.b3{width:220px;height:220px;background:#D8C8FF;bottom:-60px;left:-50px}
#banner{display:none;position:absolute;top:0;left:0;right:0;z-index:5;background:#FFD60A;color:#000;padding:calc(env(safe-area-inset-top) + 6px) 14px 6px;font-size:15px;text-align:center}
main{position:absolute;inset:0;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 12px) 18px 140px;-webkit-overflow-scrolling:touch;z-index:1}
#dock{position:absolute;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 14px);display:flex;gap:10px;z-index:4}
button{font:inherit;cursor:pointer;color:inherit}
.glass{background:var(--glass);border:1px solid var(--glassLn);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px)}
#dock button{height:62px;border-radius:31px;font-size:21px;font-weight:600;border:0}
#dock .pv{flex:1;color:var(--blue)}
#dock .nx{flex:2.2;background:var(--blue);color:#fff}
#dock button:disabled{opacity:.35}
.nav{display:flex;align-items:center;justify-content:space-between;height:40px;font-size:17px}
.nav .back{background:none;border:0;color:var(--blue);font-size:19px;padding:0;min-width:70px;text-align:left}
.nav span{color:var(--sub);font-size:15px}.nav .sp{min-width:70px}
.cap{display:flex;gap:5px;margin:2px 0 10px}.cap i{flex:1;height:5px;border-radius:3px;background:var(--line)}.cap i.on{background:var(--blue)}
h1{font-size:33px;font-weight:700;margin:4px 0 4px;line-height:1.18;letter-spacing:-.5px}
.sub{font-size:17px;color:var(--sub);margin:0 0 14px}
.grp{background:var(--card);border-radius:22px;overflow:hidden;margin-bottom:14px}
.it{display:flex;align-items:center;gap:14px;min-height:70px;padding:10px 16px;font-size:20px;border:0;border-bottom:0.5px solid var(--line);width:100%;background:none;text-align:left;border-radius:0}
.grp .it:last-child{border-bottom:0}
.it small{display:block;font-size:15px;color:var(--mut)}
.it .tx{flex:1;min-width:0;word-break:break-all}
.sq{flex:none;width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:25px}
.ck{margin-left:auto;flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);color:#fff;font-size:17px;display:flex;align-items:center;justify-content:center}
.it.sel{background:var(--selBg)}.it.sel .ck{background:var(--blue);border-color:var(--blue)}
.it.sel .ck::after{content:"✓"}
.it.lock{color:var(--lockFg);background:var(--lock);cursor:default}
.pill{margin-left:auto;flex:none;font-size:14px;padding:3px 10px;border-radius:12px;background:var(--okBg);color:var(--okFg)}
.pill.rc{background:var(--recBg);color:var(--recFg)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px;margin-bottom:10px}
.tl{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;font-size:17px;position:relative;padding:4px 0}
.tl .sq{width:70px;height:70px;border-radius:20px;font-size:34px;border:3px solid transparent}
.tl.sel .sq{border-color:var(--blue);box-shadow:0 0 0 3px var(--recBg)}
.tl.sel::after{content:"✓";position:absolute;top:0;right:10px;width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;border:2px solid var(--card)}
input[type=text],input[type=password],input[type=date],input[type=time],select,textarea{width:100%;min-height:58px;padding:10px 16px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-size:19px;margin-bottom:12px;-webkit-appearance:none}
select{width:100%;min-height:52px;padding:6px 8px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-size:16px;min-width:0}
textarea{min-height:150px;resize:vertical}
.frow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:12px}
.lnk{background:none;border:0;color:var(--blue);font-size:17px;text-decoration:underline;padding:6px 0;margin:2px 0 8px;display:inline-block}
.big{height:68px;border-radius:34px;font-size:22px;font-weight:600;width:100%;border:0;margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:10px}
.big.p{background:var(--blue);color:#fff}.big.g{color:var(--blue)}.big.o{background:#FF9500;color:#fff}
.it .qt{display:flex;align-items:center;gap:6px;font-size:20px;font-weight:600}.it .qt button{width:36px;height:36px;border-radius:18px;border:0;background:var(--line);font-size:20px;font-weight:700;color:var(--fg)}
.it .tx.tb{background:none;border:0;font:inherit;color:inherit;text-align:left;padding:0;min-height:50px}
.calc{background:var(--card);border-radius:22px;padding:12px 10px 10px;margin-bottom:12px}
.calbar{display:flex;align-items:center;justify-content:space-between;padding:0 4px 8px}.calbar b{font-size:17px;font-weight:600}
.calbar button{width:40px;height:34px;border-radius:17px;border:0;background:var(--selBg);color:var(--blue);font-size:22px;line-height:1}.calbar button:disabled{opacity:.3}
.cal2{display:grid;grid-template-columns:repeat(7,1fr);gap:4px 2px}.cal2 .wd{text-align:center;font-size:13px;color:var(--mut);padding-bottom:2px}.cal2 .wd:first-child{color:#FF3B30}.cal2 .wd:nth-child(7){color:var(--blue)}
.cd2{height:52px;border-radius:26px;border:0;background:none;color:var(--fg);font-size:19px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;position:relative}
.cd2.su{color:#FF3B30}.cd2.sa{color:var(--blue)}.cd2 small{font-size:10.5px;font-weight:500;color:var(--mut);margin-top:-1px}
.cd2:disabled{opacity:.3;font-weight:400}.cd2.tom small{color:#FF9500;font-weight:700}
.cd2.sel{background:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(0,122,255,.35)}.cd2.sel small{color:#fff}
.trow{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border-radius:22px;padding:8px 16px}.trow span{font-size:19px;font-weight:600}.trow select{width:auto;min-width:130px;margin:0;border:0;background:var(--selBg);color:var(--blue);font-weight:600;text-align:center}
.nt3{display:flex;gap:10px;align-items:center;background:#FFF4E0;color:#8a4b00;border-radius:16px;padding:10px 14px;font-size:16px;line-height:1.4;margin-bottom:12px}.nt3 i{font-style:normal;font-size:22px}@media (prefers-color-scheme:dark){.nt3{background:#3a2c10;color:#ffd58a}}
.ch2{display:inline-block;font-size:14px;padding:2px 10px;border-radius:12px;font-weight:600;white-space:nowrap}.ch2.ok{background:#dcfce7;color:#166534}.ch2.wt{background:#fef3c7;color:#92400e}
.nt2{background:#FFF4E0;color:#92400e;border-radius:16px;padding:12px 14px;font-size:17px;line-height:1.5;margin-bottom:12px}@media (prefers-color-scheme:dark){.nt2{background:#3a2c10;color:#ffd58a}}
.box{border-radius:22px;padding:14px 18px;margin-bottom:14px;font-size:19px}
.box.row{display:flex;justify-content:space-between;gap:10px}
.box .l{color:var(--sub)}
.warn{background:rgba(255,59,48,.12);color:var(--danger);border-radius:16px;padding:12px 14px;font-size:17px;margin:4px 0 12px}
.note{background:var(--card);border-radius:16px;padding:10px 14px;font-size:15px;color:var(--sub);margin:0 0 12px}
.err{color:var(--danger);font-weight:600;margin:0 0 12px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.pho{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--line)}
.pho img{width:100%;height:100%;object-fit:cover}
.pho button{position:absolute;top:4px;right:4px;width:36px;height:36px;border-radius:18px;border:0;background:#000b;color:#fff;font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{min-height:48px;padding:0 18px;border-radius:24px;border:1.5px solid var(--line);background:var(--card);font-size:17px}
.chip.sel{background:var(--blue);border-color:var(--blue);color:#fff}
.ib{flex:none;width:46px;height:46px;border-radius:14px;border:0;background:var(--selBg);font-size:21px}
.sum .it{min-height:56px;font-size:18px;align-items:flex-start;padding:12px 16px}
.sum .k{width:78px;flex:none;color:var(--sub);font-size:16px}
.sum .v{flex:1;word-break:break-all;white-space:pre-wrap;text-align:right}
.center{text-align:center}
@keyframes bb{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.6)}50%{opacity:1;transform:scale(1.1)}}
.bob{animation:bb 2.2s ease-in-out infinite}.st{transform-box:fill-box;transform-origin:center;animation:tw 1.6s ease-in-out infinite}
</style>
</head>
<body>
<div id="app">
  <div class="bl b1"></div><div class="bl b2"></div><div class="bl b3"></div>
  <div id="banner"></div>
  <main id="main"></main>
  <div id="dock"></div>
</div>

<script>
/* =====================================================================
   설정 (여기만 수정하면 작업구분/체크리스트 등을 바꿀 수 있음)
   ===================================================================== */
// 지게차 아이콘(이모지에 지게차가 없어 직접 그린 SVG)
const FORKLIFT_SVG = '<svg viewBox="0 0 32 32" width="34" height="34" aria-hidden="true"><rect x="4" y="4" width="2.6" height="22" rx="1" fill="#6B7280"/><rect x="1.5" y="23.5" width="13" height="2.6" rx="1" fill="#6B7280"/><rect x="10" y="14" width="17" height="9.5" rx="2" fill="#FF9500"/><path d="M14 14V7h9.5v7" stroke="#FF9500" stroke-width="2" fill="none" stroke-linejoin="round"/><circle cx="14.5" cy="26" r="3.3" fill="#374151"/><circle cx="24" cy="26" r="3.3" fill="#374151"/></svg>';
const CONFIG = {
  // Apps Script 웹앱 URL (…/exec). 비워두면 샘플 데이터로 동작하는 데모 모드
  API_URL: "https://script.google.com/macros/s/AKfycbxxsimDu3Thz44EDoW8Md_9NXsJTf27x8JHMYNPve0xHAXqjDTyK_1n41udrD1_HWvq/exec",

  // 작업구분·작업항목은 구글시트 '작업항목' 탭(A열=작업구분, B열=항목명)에서만 읽어온다. 아이콘은 이름이 같을 때만 붙고, 없으면 기본 아이콘
  TYPE_ICON: { "기계조립":["⚙️","#8E8E93"],"윈치조립":["⛓️","#5AC8FA"],"대조립":["🏗️","#FF9500"],"설치":["🔩","#34C759"],"시운전":["▶️","#007AFF"],
               "해체":["🔧","#FF3B30"],"포장":["📦","#AF52DE"],"입고":["📥","#30B0C7"],"이동":["🚚","#FFCC00"],"출고":["📤","#FF6482"],"기타":["📝","#8E8E93"],"설치/해체":["🛠️","#FF9500"],
               "물류":[FORKLIFT_SVG,"#FF9500"],"사외작업지원":["🤝","#5AC8FA"] },

  STATUSES: ["완료","진행중","보류-부품대기","보류-도면오류","보류-제작오류","보류-가공오류","보류-도장오류"],

  // 시간대 버튼. 이어진(바로 옆) 버튼끼리만 함께 선택 가능, 총 작업시간은 선택한 시간대 합계(휴식 포함, 점심·저녁 제외)
  TIME: { presets: [["08:30","10:00"],["10:00","12:00"],["13:00","15:00"],["15:00","17:30"],["18:00","20:00"]],
         breaks: [["12:00","13:00"],["17:30","18:00"]] },   // 점심·저녁 식사시간은 작업시간에서 뺀다

  PHOTO: { max: 5, maxSize: 1280, quality: 0.7 },
  RECENT_MAX: 5
};

/* 데모 모드용 샘플 마스터 */
const DEMO_MASTER = {
  projects:[
    {yard:"HHI",yardName:"HHI",hull:"8123",owner:"",name:"크레인",code:"",serial:"",parts:["Ts motor","특수성능 자체검사"]},
    {yard:"HHI",yardName:"HHI",hull:"8123",owner:"",name:"윈치",code:"",serial:""},
    {yard:"HHI",yardName:"HHI",hull:"8124",owner:"",name:"크레인",code:"",serial:""},
    {yard:"SHI",yardName:"SHI",hull:"2201",owner:"",name:"크레인",code:"",serial:""}],
  inspItems:[{type:"성능검사",name:"DAVIT ARM"},{type:"성능검사",name:"HYD. POWER UNIT"},{type:"출하검사",name:"CONTROL PANEL"}],
  workers:[{name:"김직영",affil:"직영",vendor:""},{name:"이직영",affil:"직영",vendor:""},
           {name:"박외주",affil:"외주",vendor:"대한용접"},{name:"정외주",affil:"외주",vendor:"성진기계"}],
  vendors:[{name:"대한용접"},{name:"성진기계"}],
  items:[{type:"시운전",name:"유압유 주입"},{type:"시운전",name:"로드 테스트"},{type:"설치/해체",name:"탑재"},{type:"설치/해체",name:"해체"},{type:"포장",name:"도장수정"}]
};

/* =====================================================================
   저장소 / 상태
   ===================================================================== */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const uid = () => "c" + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const toMin = t => { const [h,m] = t.split(":").map(Number); return h*60 + m; };
const fmtMin = m => m ? `${Math.floor(m/60)}시간` + (m%60 ? ` ${m%60}분` : "") : "0시간";
const HHMM = /^\d\d:\d\d$/;

const STEPS = ["project","type","items","time","status","memo","confirm"];
const TITLES = { project:"프로젝트", type:"작업 구분", items:"작업 항목", time:"작업 시간", status:"진행 상태", memo:"사진·메모", confirm:"확인" };

function freshState(){
  const r = LS.get("wl_recent", [])[0];   // 방금 쓴 프로젝트를 미리 선택
  return { date: today(), yard: r ? r.yard : "", hull: r ? r.hull : "", equip: r ? r.equip : "",
           type:"", items:[], slots:[], direct:false, start:"", end:"", status:"", memo:"", photos:[], step:"project", clientId: uid() };
}
let who = LS.get("wl_who", null);            // { name, affil, vendor }
if(!who || !who.name) who = null;
let S = freshState();
let master = LS.get("wl_master", null);
if(master && !master.projects) master = null;
let view = "home";    // pin | setup | home | wizard | done | thanks | mylogs
let detailId = "", busy = false, msg = "", doneInfo = null, q = "", manage = false, editDate = false, sg = "";

function saveDraft(){ const d = Object.assign({}, S); delete d.photos; LS.set("wl_draft", d); }
const getPin = () => LS.get("wl_pin", "");
const getQueue = () => LS.get("wl_queue", []);
const getLogs = () => LS.get("wl_logs", []);

/* =====================================================================
   API
   ===================================================================== */
async function apiGet(params){
  const u = new URL(CONFIG.API_URL);
  Object.entries(params).forEach(([k,v]) => u.searchParams.set(k, v));
  const r = await fetch(u.toString());
  return r.json();
}
async function apiPost(payload){
  const r = await fetch(CONFIG.API_URL, { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(payload) });
  return r.json();
}
async function loadMaster(){
  if(!CONFIG.API_URL){ master = master || JSON.parse(JSON.stringify(DEMO_MASTER)); return true; }
  try{
    const res = await apiGet({ action:"master", pin:getPin() });
    if(res.error === "unauthorized"){ LS.set("wl_pin",""); view = "pin"; msg = "접근코드가 올바르지 않습니다."; return false; }
    if(res.error){ msg = res.error; }
    else { master = res; master.inspItems = master.inspItems || []; getOps().forEach(o => applyOp(master, o)); saveMaster(); return true; }
  }catch(e){ /* 오프라인: 캐시 사용 */ }
  return !!master;
}
async function loadMyLogs(){
  if(!CONFIG.API_URL || !navigator.onLine || !who) return;
  try{
    const r = await apiGet({ action:"mylogs", pin:getPin(), writer:who.name });
    if(r.logs){
      const queued = getLogs().filter(l => l.writer === who.name && String(l.id).startsWith("대기-"));
      const other = getLogs().filter(l => l.writer !== who.name);
      LS.set("wl_logs", other.concat(r.logs, queued));
      if(view === "home" || view === "mylogs" || view === "logdetail" || (view === "wizard" && S.step === "time")) render();
    }
  }catch(e){}
}

/* =====================================================================
   작업항목 추가/수정/삭제 (시트 '작업항목' 탭에 자동 반영)
   ===================================================================== */
let opsFlushing = false;
const getOps = () => LS.get("wl_ops", []);
const saveMaster = () => LS.set("wl_master", master);
function applyOp(m, o){   // 서버(Code.gs applyItemOps_)와 같은 규칙: 한 구분의 마지막 항목을 지우면 항목명만 비우고 구분은 남긴다
  const key = o.scope === "insp" ? "inspItems" : "items";   // insp: 검사신청의 부품 목록
  m[key] = m[key] || [];
  const L = m[key];
  const same = L.filter(x => x.type === o.type);
  const i = L.findIndex(x => x.type === o.type && x.name === o.name);
  if(o.op === "add"){ if(i < 0){ const b = L.find(x => x.type === o.type && !x.name); if(b) b.name = o.name; else L.push({ type:o.type, name:o.name }); } }
  else if(o.op === "del"){ if(i >= 0){ if(same.length <= 1) L[i].name = ""; else L.splice(i,1); } }
  else if(o.op === "rename" && i >= 0){
    if(L.some(x => x.type === o.type && x.name === o.newName)) L.splice(i,1); else L[i].name = o.newName;
  }
}
const workTypes = () => [...new Set(master.items.map(i => i.type).filter(Boolean))];

async function flushOps(){
  if(opsFlushing || !CONFIG.API_URL || !navigator.onLine) return;
  const ops = getOps(); if(!ops.length) return;
  opsFlushing = true;
  try{
    const r = await apiPost({ pin:getPin(), action:"itemops", ops });
    if(r && r.ok) LS.set("wl_ops", getOps().slice(ops.length));

}

/* =====================================================================
   시간 계산 / 겹침 검사 (같은 작성자, 같은 날짜)
   ===================================================================== */
const P = () => CONFIG.TIME.presets;
function range(){
  if(S.direct) return (S.start && S.end) ? [S.start, S.end] : null;
  if(!S.slots.length) return null;
  return [P()[S.slots[0]][0], P()[S.slots[S.slots.length-1]][1]];
}
// 시작~종료 사이 시간에서 식사시간(점심 12:00~13:00, 저녁 17:30~18:00)과 겹치는 만큼을 뺀 분
function netMin(a, b){
  const s = toMin(a), e = toMin(b);
  if(e <= s) return 0;
  let m = e - s;
  CONFIG.TIME.breaks.forEach(([b0, b1]) => { m -= Math.max(0, Math.min(e, toMin(b1)) - Math.max(s, toMin(b0))); });
  return Math.max(0, m);
}
function totalMin(){
  if(S.direct) return (S.start && S.end) ? netMin(S.start, S.end) : 0;
  return S.slots.reduce((t,i) => t + netMin(P()[i][0], P()[i][1]), 0);
}
const hoursNum = () => Math.round(totalMin()/60*100)/100;
const timeTxt = () => S.direct ? `${S.start} ~ ${S.end}` : S.slots.map(i => P()[i].join("~")).join(", ");
function myDayLogs(){
  return getLogs().filter(l => who && l.writer === who.name && l.date === S.date && HHMM.test(l.start || "") && HHMM.test(l.end || ""));
}
const overlaps = (a0, a1, b0, b1) => toMin(a0) < toMin(b1) && toMin(b0) < toMin(a1);
const conflictWith = r => r ? (myDayLogs().find(l => overlaps(r[0], r[1], l.start, l.end)) || null) : null;
function dayStats(date){
  const ls = getLogs().filter(l => who && l.writer === who.name && l.date === date);
  return { n: ls.length, m: ls.reduce((t,l) => t + Math.round((parseFloat(l.hours) || 0) * 60), 0) };
}
function toggleSlot(i){
  const p = P()[i];
  if(conflictWith([p[0], p[1]])) return;
  const s = S.slots;
  if(s.includes(i)) S.slots = (i === Math.min(...s) || i === Math.max(...s)) ? s.filter(x => x !== i) : [i];
  else if(s.length && (i === Math.min(...s) - 1 || i === Math.max(...s) + 1)) S.slots = s.concat(i);
  else S.slots = [i];
  S.slots.sort((a,b) => a-b);
}

function valid(id){
  switch(id){
    case "project": return !!(S.yard && S.hull && S.equip);
    case "type": return !!S.type;
    case "items": return S.items.length > 0;
    case "time": { const r = range(); return !!(r && totalMin() > 0 && !conflictWith(r)); }
    case "status": return !!S.status;
    default: return true;
  }
}

/* ---------- 프로젝트 검색 ---------- */
function projMatches(p, term){
  if(!term) return true;
  return [p.yard, p.yardName, p.hull, p.name, p.code, p.owner, p.serial].concat(p.parts || []).join(" ").toLowerCase().includes(term.toLowerCase());
}
// 프로젝트 아래에 보여 줄 품명(검색어에 걸린 것을 먼저, 최대 3개)
function partsShown(p, term){
  const t = (term || "").trim().toLowerCase(), ps = p.parts || [];
  const hit = t ? ps.filter(x => x.toLowerCase().includes(t)) : [];
  return hit.concat(ps.filter(x => !hit.includes(x))).slice(0, 3);
}

function buildPayload(){
  const r = range();
  return { pin:getPin(), clientId:S.clientId, date:S.date, writer:who.name, affil:who.affil, vendor:who.affil==="외주" ? (who.vendor||"") : "",
    yard:S.yard, hull:S.hull, equip:S.equip, type:S.type, items:S.items, start:r[0], end:r[1],
    hours:hoursNum(), status:S.status, detail:S.memo.trim(), notes:"", photos:S.photos };
}
function toLog(p, id){
  return { id, date:p.date, writer:p.writer, affil:p.affil, vendor:p.vendor, yard:p.yard, hull:p.hull, equip:p.equip,
    type:p.type, items:p.items, start:p.start, end:p.end, hours:p.hours, status:p.status, detail:p.detail, notes:p.notes };
}
function rememberRecent(){
  const r = LS.get("wl_recent", []).filter(x => !(x.yard===S.yard && x.hull===S.hull && x.equip===S.equip));
  r.unshift({ yard:S.yard, hull:S.hull, equip:S.equip });
  LS.set("wl_recent", r.slice(0, CONFIG.RECENT_MAX));
}
function finish(info, p){
  rememberRecent();
  const logs = getLogs(); logs.push(toLog(p, info.id || ("대기-" + p.clientId))); LS.set("wl_logs", logs.slice(-300));
  LS.set("wl_draft", {});
  doneInfo = info; view = "done"; busy = false; render(); $("#main").scrollTop = 0;
}
async function submit(){
  if(busy) return;
  const bad = STEPS.slice(0, -1).find(x => !valid(x));
  if(bad){ msg = bad === "time" ? "작업 시간을 확인하세요. 이미 쓴 시간과 겹치면 안 돼요." : `"${TITLES[bad]}" 항목을 확인하세요.`; return go(bad); }
  busy = true; msg = ""; render();
  const p = buildPayload();
  if(!CONFIG.API_URL){ return finish({ id:`${p.yard}-${p.hull}-${p.equip}-${p.date.replace(/-/g,"")}-${p.writer}-01 (데모)` }, p); }
  let res;
  try{ res = await apiPost(p); }
  catch(e){
    const qd = getQueue(); qd.push(p);
    if(!LS.set("wl_queue", qd)){ busy = false; msg = "저장 공간이 부족합니다. 사진 수를 줄여 다시 시도하세요."; return render(); }
    return finish({ queued:true }, p);
  }
  if(res && res.ok) return finish({ id:res.id }, p);
  busy = false;
  if(res && res.error === "unauthorized"){ view = "pin"; msg = "접근코드를 다시 입력하세요."; return render(); }
  if(res && res.error === "overlap"){ msg = "같은 시간에 이미 쓴 일지가 있어요. 시간을 바꿔 주세요."; loadMyLogs(); return go("time"); }
  msg = "제출 실패: " + ((res && res.error) || "알 수 없는 오류"); render();
}
let flushing = false;
async function flushQueue(){
  if(flushing || !CONFIG.API_URL || !navigator.onLine) return;
  flushing = true;
  try{
    let qd = getQueue();
    while(qd.length){
      const p = Object.assign({}, qd[0], { pin:getPin() });
      let res; try{ res = await apiPost(p); }catch(e){ break; }
      if(res && res.ok){
        qd = getQueue().slice(1); LS.set("wl_queue", qd);
        const logs = getLogs().map(l => l.id === "대기-" + p.clientId ? Object.assign(l, { id:res.id }) : l); LS.set("wl_logs", logs);
      } else if(res && res.error === "overlap"){   // 겹치는 대기 건은 버려서 대기열이 막히지 않게 함
        qd = getQueue().slice(1); LS.set("wl_queue", qd);
        LS.set("wl_logs", getLogs().filter(l => l.id !== "대기-" + p.clientId));
      } else { if(res && res.error === "unauthorized"){ view = "pin"; msg = "접근코드를 다시 입력하세요."; } break; }
    }
  } finally { flushing = false; render(); }
}

/* ---------- 사진 리사이즈 ---------- */
function resizeImage(file){
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const m = CONFIG.PHOTO.maxSize, k = Math.min(1, m / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); resolve(c.toDataURL("image/jpeg", CONFIG.PHOTO.quality));
    };
    img.onerror = reject; img.src = url;
  });
}

function setWho(name, g){
  const w = master.workers.find(x => x.name === name && (g === "직영" ? w0(x) : (x.affil === "외주" && x.vendor === g)));
  who = { name, affil: g === "직영" ? "직영" : "외주", vendor: g === "직영" ? "" : g };
  LS.set("wl_who", who); sg = ""; view = "home"; render(); loadMyLogs();
}
const w0 = x => x.affil !== "외주";
const NAV_LOCK = ["logopen","pick","pickproj","toggle","preset","goto","new","nextjob","setwho","inew","ilist","iopen","ipick","ipickproj","igoto","inewagain"];
const REPEAT_OK = ["iqty"];
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-a]"); if(!t) return;
  const a = t.dataset.a, v = t.dataset.v, f = t.dataset.f;
  // 중복 터치 방지: 같은 버튼 연타, 화면 전환 직후 겹친 터치는 무시
  const now = Date.now(), key = [a, f, v, t.dataset.y, t.dataset.h, t.dataset.e].join("|");
  if(key === lastKey && now - lastAt < 400 && !REPEAT_OK.includes(a)) return;
  if(NAV_LOCK.includes(a) && now - navAt < 400) return;
  lastKey = key; lastAt = now;
  switch(a){
    case "new": startNew(); break;
    case "nextjob": nextJob(); break;
    case "endday": view = "thanks"; render(); $("#main").scrollTop = 0; break;
    case "home": view = "home"; navAt = Date.now(); render(); $("#main").scrollTop = 0; break;
    case "logs": view = "mylogs"; navAt = Date.now(); render(); $("#main").scrollTop = 0; loadMyLogs(); break;
    case "logopen": detailId = v; view = "logdetail"; navAt = Date.now(); render(); $("#main").scrollTop = 0; break;
    case "who": sg = ""; view = "setup"; navAt = Date.now(); render(); $("#main").scrollTop = 0; break;
    case "sgroup": sg = v; render(); break;
    case "setwho": setWho(v, t.dataset.g); break;
    case "pick":
      if(f === "type" && S.type !== v) S.items = [];
      S[f] = v; saveDraft(); render(); break;
    case "pickproj": S.yard = t.dataset.y; S.hull = t.dataset.h; S.equip = t.dataset.e; saveDraft(); render(); break;
    case "toggle": { const i = S.items.indexOf(v); i < 0 ? S.items.push(v) : S.items.splice(i,1); saveDraft(); render(); break; }
    case "preset": toggleSlot(Number(v)); saveDraft(); render(); break;
    case "direct": S.direct = !S.direct; S.slots = []; S.start = ""; S.end = ""; saveDraft(); render(); break;
    case "manage": manage = !manage; render(); break;
    case "additembtn": addMasterItem($("#additem").value); break;
    case "itemedit": {
      const nn = (prompt("항목 이름 수정", v) || "").trim(); if(!nn || nn === v) break;
      itemOp({ op:"rename", type:S.type, name:v, newName:nn });
      S.items = S.items.map(x => x === v ? nn : x).filter((x,i,arr) => arr.indexOf(x) === i); saveDraft(); render(); break; }
    case "itemdel":
      if(!confirm(`"${v}" 항목을 삭제할까요?\n(모든 작업자의 목록에서 사라집니다)`)) break;
      itemOp({ op:"del", type:S.type, name:v }); S.items = S.items.filter(x => x !== v); saveDraft(); render(); break;
    case "delphoto": S.photos.splice(v,1); render(); break;
    case "editdate": editDate = !editDate; render(); break;
    case "next": advance(); break;
    case "back": back(); break;
    case "goto": go(v); break;
    case "submit": submit(); break;
    case "retry": await loadMaster(); render(); break;
    case "pinok": {
      const val = ($("#pin").value || "").trim(); if(!val) break;
      LS.set("wl_pin", val); msg = ""; view = "home"; show(`<h1>확인 중…</h1>`, "");
      await loadMaster(); if(view !== "pin") view = who ? "home" : "setup"; render(); loadMyLogs(); break; }
    default: inspAction(a, v, t);
  }
});

const INSP = { perf:{ label:"성능검사", sub:"성능 검사용", icon:"⚙️", color:"#FF9500" }, ship:{ label:"출하검사", sub:"출하 검사용", icon:"📦", color:"#34C759" } };
const tomorrow = () => { const d = new Date(); d.setDate(d.getDate() + 1); return ymd(d); };
const dow = s => "일월화수목금토"[new Date(s + "T00:00:00").getDay()];
function freshInsp(){
  const r = LS.get("wl_recent", [])[0];
  return { type:"", yard:r ? r.yard : "", hull:r ? r.hull : "", equip:r ? r.equip : "", parts:{}, reqDate:"", reqTime:"10:00", checks:{}, step:"itype", clientId: uid() };
}
let iCalOff = 0, IS = freshInsp(), iManage = false, iMsg = "", idetailId = "", idoneInfo = null, ibusy = false;
const getIlogs = () => LS.get("wl_ilogs", []);
const iSecs = () => IS.type ? INSP_CHECKS[IS.type] : [];
const iSteps = () => ["itype","iproject","iparts","idate"].concat(iSecs().map((_, k) => "ichk" + k), ["iconfirm"]);
const iTitle = id => id.startsWith("ichk") ? `확인 사항 ${Number(id.slice(4)) + 1}/${iSecs().length}` : ({ itype:"검사 종류", iproject:"프로젝트", iparts:"검사 부품", idate:"검사 일시", iconfirm:"확인" })[id];

const iProjLabel = () => `${IS.yard}-${IS.hull}-${IS.equip}`;
function iPartsName(){
  const p = (master.projects || []).find(x => x.yard === IS.yard && x.hull === IS.hull && x.name === IS.equip);
  return p && p.parts ? p.parts.join(", ") : "";
}
function iCheckCount(){
  let n = 0, t = 0;
  iSecs().forEach((sec, k) => sec.items.forEach((_, j) => { t++; if(IS.checks[k + "-" + j]) n++; }));
  return { n, t };
}
function iValid(id){
  if(id === "itype") return !!IS.type;
  if(id === "iproject") return !!(IS.yard && IS.hull && IS.equip);
  if(id === "iparts") return Object.keys(IS.parts).length > 0;
  if(id === "idate") return !!(IS.reqDate && IS.reqDate >= tomorrow() && IS.reqTime);
  return true;
}
function inav(i, total){
  return `<div class="nav"><button class="back" data-a="iprev">‹ 이전</button><span>${i + 1} / ${total} · ${iTitle(iSteps()[i])}</span><span class="sp"></span></div>
    <div class="cap">${Array.from({ length:total }, (_, k) => `<i class="${k <= i ? "on" : ""}"></i>`).join("")}</div>`;
}
function renderIStep(){
  const steps = iSteps(); if(!steps.includes(IS.step)) IS.step = steps[0];
  const i = steps.indexOf(IS.step), last = IS.step === "iconfirm";
  const dock = `<button class="pv glass" data-a="iprev">이전</button>` + (last
    ? `<button class="nx" style="background:#FF9500" data-a="isubmit" ${ibusy ? "disabled" : ""}>${ibusy ? "신청 중… (잠시만요)" : "검사 신청하기"}</button>`
    : `<button class="nx" data-a="inext" ${iValid(IS.step) ? "" : "disabled"}>다음</button>`);
  show(inav(i, steps.length) + ISTEP(IS.step), dock);

function renderCal(){
  const tom = tomorrow(), tod = today(), cells = [];
  const t = new Date(tom + "T00:00:00");
  const start = new Date(t); start.setDate(t.getDate() - t.getDay() + iCalOff * 7);   // 내일이 든 주의 일요일부터 2주
  for(let k = 0; k < 14; k++){
    const d = new Date(start); d.setDate(start.getDate() + k);
    const ds = ymd(d), off = ds < tom, sel = ds === IS.reqDate, wd = d.getDay();
    const sub = ds === tod ? "오늘" : ds === tom ? "내일" : d.getDate() === 1 ? `${d.getMonth() + 1}월` : "";
    cells.push(`<button class="cd2 ${sel ? "sel" : ""} ${ds === tom ? "tom" : ""} ${wd === 0 ? "su" : wd === 6 ? "sa" : ""}" ${off ? "disabled" : `data-a="idpick" data-v="${ds}"`}>${d.getDate()}${sub ? `<small>${sub}</small>` : ""}</button>`);
  }
  const b = new Date(start); b.setDate(b.getDate() + 13);
  const lab = start.getMonth() === b.getMonth() ? `${start.getFullYear()}년 ${start.getMonth() + 1}월` : `${start.getMonth() + 1}월 ${start.getDate()}일 ~ ${b.getMonth() + 1}월 ${b.getDate()}일`;
  return `<div class="calc"><div class="calbar"><button data-a="ical" data-d="-1" ${iCalOff <= 0 ? "disabled" : ""} aria-label="이전 주">‹</button><b>${lab}</b><button data-a="ical" data-d="1" aria-label="다음 주">›</button></div>
    <div class="cal2">${"일월화수목금토".split("").map(x => `<span class="wd">${x}</span>`).join("")}${cells.join("")}</div></div>`;
}

    const rec = LS.get("wl_recent", []).slice(0, 3);

    if(IS.equip && !rows.some(r => r.yard === IS.yard && r.hull === IS.hull && r.equip === IS.equip)) rows.unshift({ yard:IS.yard, hull:IS.hull, equip:IS.equip, tag:"선택한 프로젝트" });

      ${rows.length ? `<div class="grp">${rows.map(r => sel(r.yard === IS.yard && r.hull === IS.hull && r.equip === IS.equip,

          `<span class="sq" style="background:var(--selBg)">🚢</span><span class="tx">${esc(r.yard)}-${esc(r.hull)}-${esc(r.equip)}<small>${r.tag}</small></span>`)).join("")}</div>` : ""}
      <input type="text" id="q" placeholder="🔍 다른 프로젝트 검색 (호선, 장비, 품명)" value="${esc(q)}" style="margin-bottom:6px">
      <div id="plist"></div>`;
  }
  if(id === "iparts"){
    const list = (master.inspItems || []).filter(x => x.type === iTab() && x.name).map(x => x.name);

    return `<h1>어떤 부품을 검사받나요?</h1><p class="sub">${esc(iTab())} · 해당하는 것을 모두 누르세요.</p>
      ${list.length ? "" : `<p class="sub">아래에 부품명을 입력해 추가하세요. 한 번 추가하면 다음부터 목록에서 고를 수 있어요.</p>`}
      <div class="grp">${list.map(n => {
        if(iManage) return `<div class="it"><span class="tx">${esc(n)}</span><button class="ib" data-a="iedit" data-v="${esc(n)}" aria-label="수정">✏️</button><button class="ib" data-a="idel" data-v="${esc(n)}" aria-label="삭제">🗑️</button></div>`;
        const on = n in IS.parts;
        return `<div class="it ${on ? "sel" : ""}"><button class="tx tb" data-a="itoggle" data-v="${esc(n)}">${esc(n)}</button>${on ? `<span class="qt"><button data-a="iqty" data-v="${esc(n)}" data-d="-1" aria-label="줄이기">−</button><span>${IS.parts[n]}</span><button data-a="iqty" data-v="${esc(n)}" data-d="1" aria-label="늘리기">＋</button></span>` : ""}<span class="ck"></span></div>`;
      }).join("")}</div>
      <div style="display:flex;gap:8px"><input type="text" id="addinsp" placeholder="새 부품명 입력" style="margin:0"><button class="nx" style="flex:none;width:92px;height:58px;border-radius:16px;border:0;background:var(--blue);color:#fff;font-size:18px;font-weight:600" data-a="iaddbtn">추가</button></div>
      <button class="lnk" style="margin-top:10px" data-a="imanage">${iManage ? "수정 · 삭제 끝내기" : "부품 수정 · 삭제"}</button>`;
  }
  if(id === "idate"){
    const opts = []; for(let m = 5*60; m <= 23*60 + 30; m += 30){ const t = pad(Math.floor(m/60)) + ":" + pad(m % 60); opts.push(`<option value="${t}" ${t === IS.reqTime ? "selected" : ""}>${t}</option>`); }

/* ---------- 신청 / 목록 ---------- */
async function loadMyInsp(){
  if(!CONFIG.API_URL || !navigator.onLine || !who) return;
  try{
    const r = await apiGet({ action:"myinsp", pin:getPin(), writer:who.name });
    if(r.items){
      LS.set("wl_ilogs", getIlogs().filter(l => l.writer !== who.name).concat(r.items));
      if(["ilist","idetail"].includes(view)) render();
    }
  }catch(e){}
}
function iPayload(){
  return { pin:getPin(), action:"insp", clientId:IS.clientId, type:IS.type, writer:who.name, affil:who.affil, vendor:who.affil === "외주" ? (who.vendor || "") : "",
    yard:IS.yard, hull:IS.hull, equip:IS.equip, pn:iPartsName(), parts:Object.keys(IS.parts).map(n => ({ name:n, qty:IS.parts[n] })),
    reqDate:IS.reqDate, reqTime:IS.reqTime, checks:iSecs().map((sec, k) => sec.items.map((_, j) => IS.checks[k + "-" + j] ? 1 : 0)) };
}
function iRemember(){
  const r = LS.get("wl_recent", []).filter(x => !(x.yard === IS.yard && x.hull === IS.hull && x.equip === IS.equip));
  r.unshift({ yard:IS.yard, hull:IS.hull, equip:IS.equip }); LS.set("wl_recent", r.slice(0, CONFIG.RECENT_MAX));
}
async function isubmit(){
  if(ibusy) return;
  const bad = iSteps().slice(0, -1).find(x => !iValid(x));
  if(bad){ iMsg = `"${iTitle(bad)}" 항목을 확인하세요.`; IS.step = bad; return render(); }
  ibusy = true; iMsg = ""; render();
  const p = iPayload();
  if(!CONFIG.API_URL){ ibusy = false; iRemember(); idoneInfo = { id:"PT-" + today().replace(/-/g, "") + "-01 (데모)", mail:"발송완료" }; view = "idone"; return render(); }
  let res;
  try{ res = await apiPost(p); }
  catch(e){ ibusy = false; iMsg = "연결이 불안정해요. 잠시 후 [검사 신청하기]를 다시 눌러 주세요. (중복으로 접수되지 않아요)"; return render(); }
  ibusy = false;
  if(res && res.ok){ iRemember(); idoneInfo = res; view = "idone"; navAt = Date.now(); render(); $("#main").scrollTop = 0; loadMyInsp(); return; }
  if(res && res.error === "unauthorized"){ view = "pin"; msg = "접근코드를 다시 입력하세요."; return render(); }
  if(res && res.error === "date"){ iMsg = "검사 요구일은 내일부터 고를 수 있어요."; IS.reqDate = ""; IS.step = "idate"; return render(); }
  iMsg = "신청 실패: " + ((res && res.error) || "알 수 없는 오류"); render();
}

  const ok = idoneInfo && idoneInfo.mail === "발송완료";

      <h1 style="text-align:center;font-size:30px">신청했어요</h1>
      <p class="sub">관리번호 <b>${esc(idoneInfo.id)}</b></p>
      <div class="glass box" style="margin:14px 0;font-size:18px;text-align:left">${ok ? `<span class="ch2 ok">PDF 발송 완료</span><div style="margin-top:8px;color:var(--sub)">신청서 PDF를 지정된 메일로 보냈어요.</div>`

  const html = mine.map(l => {
    const head = l.date !== lastDate ? `<p class="sub" style="margin:14px 4px 6px;font-weight:600">${esc(l.date)}</p>` : ""; lastDate = l.date;
    return head + `<div class="grp" style="margin-bottom:8px"><button class="it" style="display:block" data-a="iopen" data-v="${esc(l.id)}"><div style="font-weight:600">${esc(l.id)} <span class="ch2 ${l.status === "발송완료" ? "ok" : "wt"}" style="font-size:13px">${esc(l.status)}</span></div>
      <small>${esc(l.yard)}-${esc(l.hull)}-${esc(l.equip)} · ${esc(l.type)}</small><div style="font-size:16px;color:var(--sub)">검사 요구 ${esc(l.req)}</div></button></div>`;
  }).join("");
  show(`<div class="nav"><button class="back" data-a="home">‹ 홈</button><span></span><span class="sp"></span></div>
    <h1>내가 쓴 검사신청</h1><p class="sub">누르면 자세히 볼 수 있어요. (수정은 할 수 없어요)</p>${html || `<p class="sub">검사신청 내역이 없어요.</p>`}`, "");
}
function renderIDetail(){
  const l = getIlogs().find(x => x.id === idetailId);
  if(!l){ view = "ilist"; return renderIList(); }
  const row = (k, v) => `<div class="it" style="min-height:56px;font-size:18px;align-items:flex-start;padding:12px 16px"><span class="k" style="width:86px;flex:none;color:var(--sub);font-size:16px">${k}</span><span style="flex:1;word-break:break-all;white-space:pre-wrap;text-align:right">${esc(v) || "-"}</span></div>`;
  show(`<div class="nav"><button class="back" data-a="ilist">‹ 목록</button><span></span><span class="sp"></span></div>
    <h1>검사신청 보기</h1><p class="sub">${esc(l.id)} <span class="ch2 ${l.status === "발송완료" ? "ok" : "wt"}" style="font-size:13px">${esc(l.status)}</span></p>
    <div class="grp">${row("검사 종류", l.type)}${row("프로젝트", `${l.yard}-${l.hull}-${l.equip}`)}${row("품명", l.pn)}${row("신청일", l.date)}${row("검사 요구", l.req)}${row("검사 부품", String(l.parts).split(", ").join("\n"))}${row("확인 사항", l.checks ? l.checks + " 확인" : "")}</div>
    ${l.pdf ? `<a class="big g glass" style="text-decoration:none" href="${esc(l.pdf)}" target="_blank" rel="noopener">PDF 신청서 열기</a>` : ""}
    <p class="note">제출한 검사신청은 앱에서 고칠 수 없어요. 수정이 필요하면 담당자에게 알려 주세요.</p>`, "");
}

/* ---------- 부품(검사항목) 관리 ---------- */
function inspAddPart(name){
  name = (name || "").trim(); if(!name || !IS.type) return;
  itemOp({ scope:"insp", op:"add", type:iTab(), name });
  if(!(name in IS.parts)) IS.parts[name] = 1;
  render();
}

/* ---------- 이벤트 ---------- */
function ijump(){ navAt = Date.now(); render(); $("#main").scrollTop = 0; }
function inspAction(a, v, t){
  switch(a){
    case "idpick": IS.reqDate = v; iMsg = ""; render(); break;
    case "ical": iCalOff = Math.max(0, iCalOff + Number(t.dataset.d)); render(); break;
    case "inew": IS = freshInsp(); iCalOff = 0; iMsg = ""; iManage = false; q = ""; view = "iwiz"; ijump(); loadMyInsp(); break;
    case "inewagain": { const keep = { yard:IS.yard, hull:IS.hull, equip:IS.equip }; IS = Object.assign(freshInsp(), keep); iMsg = ""; iManage = false; q = ""; view = "iwiz"; ijump(); break; }
    case "ilist": view = "ilist"; ijump(); loadMyInsp(); break;
    case "iopen": idetailId = v; view = "idetail"; ijump(); break;
    case "ipick": if(IS.type !== v){ IS.type = v; IS.parts = {}; IS.checks = {}; } render(); break;
    case "ipickproj": IS.yard = t.dataset.y; IS.hull = t.dataset.h; IS.equip = t.dataset.e; render(); break;
    case "itoggle": if(v in IS.parts) delete IS.parts[v]; else IS.parts[v] = 1; render(); break;
    case "iqty": { const n = (IS.parts[v] || 1) + Number(t.dataset.d); IS.parts[v] = Math.max(1, Math.min(99, n)); render(); break; }
    case "imanage": iManage = !iManage; render(); break;
    case "iaddbtn": inspAddPart($("#addinsp").value); break;
    case "iedit": {
      const nn = (prompt("부품명 수정", v) || "").trim(); if(!nn || nn === v) break;
      itemOp({ scope:"insp", op:"rename", type:iTab(), name:v, newName:nn });
      if(v in IS.parts){ IS.parts[nn] = IS.parts[v]; delete IS.parts[v]; } render(); break; }
    case "idel":
      if(!confirm(`"${v}" 부품을 삭제할까요?\n(모든 작업자의 목록에서 사라집니다)`)) break;
      itemOp({ scope:"insp", op:"del", type:iTab(), name:v }); delete IS.parts[v]; render(); break;
    case "icheck": IS.checks[v] = !IS.checks[v]; render(); break;
    case "icheckall": { const k = Number(v), sec = iSecs()[k], all = sec.items.every((_, j) => IS.checks[k + "-" + j]); sec.items.forEach((_, j) => { IS.checks[k + "-" + j] = !all; }); render(); break; }
    case "inext": { const s = iSteps(), i = s.indexOf(IS.step); if(iValid(IS.step)){ IS.step = s[Math.min(i + 1, s.length - 1)]; iMsg = ""; ijump(); } break; }
    case "iprev": { const s = iSteps(), i = s.indexOf(IS.step); if(i <= 0){ view = "home"; } else IS.step = s[i - 1]; iMsg = ""; ijump(); break; }
    case "igoto": IS.step = v; iMsg = ""; ijump(); break;
    case "isubmit": isubmit(); break;
  }
}

/* =====================================================================
   시작
   ===================================================================== */
(async function init(){
  if(CONFIG.API_URL && !getPin()){ view = "pin"; render(); return; }
  render();
  await loadMaster();
  // 서버 응답을 기다리는 동안 사용자가 다음 화면으로 넘어갔다면 그대로 둔다(첫 화면으로 되돌리지 않음)
  if(view === "home" || view === "setup") view = who ? "home" : "setup";
  render();
  flushOps();
  flushQueue();
  loadMyLogs();
})();
</script>
